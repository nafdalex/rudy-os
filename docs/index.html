<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudy OS</title>
<meta name="description" content="Rudy OS is a free, open source agent office. It wraps the CLI coding agent you already use and runs a whole office of agents on your own machine.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #141414; color: #F2ECE4;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  main { text-align: center; max-width: 560px; }
  .logo { width: 88px; height: 88px; display: block; margin: 0 auto 28px; image-rendering: pixelated; }
  h1 { font-family: "Press Start 2P", monospace; font-size: 26px; letter-spacing: 2px; margin-bottom: 22px; color: #FFFFFF; }
  h1 .os { color: #B3121B; }
  p.tag { font-size: 14px; line-height: 1.7; color: #B8B2A6; margin-bottom: 34px; }
  .soon {
    display: inline-block; font-family: "Press Start 2P", monospace; font-size: 12px;
    color: #F2ECE4; border: 2px solid #B3121B; border-radius: 3px;
    padding: 13px 24px; letter-spacing: 3px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .soon { animation: none; } }
  footer { margin-top: 54px; font-size: 12px; color: #6E6A61; }
  footer a { color: #B8B2A6; text-decoration: none; border-bottom: 1px solid #3A3833; }
  footer a:hover { color: #FFFFFF; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.png?v=2" alt="Rudy OS" width="88" height="88">
  <h1>RUDY <span class="os">OS</span></h1>
  <p class="tag">A free, open source agent office for your own machine.</p>
  <div class="soon">COMING SOON</div>
  <footer>
    <a href="https://github.com/rudydoes/rudy-os">GitHub</a> &nbsp;·&nbsp; <a href="mailto:alex@rudydoes.com">alex@rudydoes.com</a>
  </footer>
</main>
</body>
</html>
