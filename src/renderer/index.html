<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rudy OS</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces, total: Press Start 2P is the pixel identity (labels,
         buttons, titles), JetBrains Mono is everything you read — the same
         face the terminal itself uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #161616; color: #E8E6E3;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 56px; height: 56px;
        background: #111111; color: #E8E6E3; border: 2px solid #2E2E2E;
        font-family: "Press Start 2P", monospace; font-size: 16px;
      }
      #cth-splash .mk span { color: #E5484D; }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 13px; }
      #cth-splash .hint { font-size: 13px; color: #8B8885; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">R<span>.</span></div>
        <div class="title">RUDY <span style="background:#B3121B;color:#F2ECE4;padding:3px 6px 2px">OS</span></div>
        <div class="hint">booting the hive…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
